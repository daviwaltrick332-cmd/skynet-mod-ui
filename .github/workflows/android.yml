name: Build SKYNET Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "**.py"
      - "buildozer.spec"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "**.py"
      - "buildozer.spec"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential cmake git libffi-dev libltdl-dev \
            libncurses5-dev libncursesw5-dev libssl-dev libtinfo5 libtool \
            pkg-config unzip zip zlib1g-dev

      - name: Install Buildozer
        run: python -m pip install --upgrade pip setuptools buildozer "Cython==0.29.33"

      - name: Cache Android build files
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: android-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            android-${{ runner.os }}-

      - name: Build debug APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skynet-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
